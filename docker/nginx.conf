upstream frappe_backend {
    server backend:8000 fail_timeout=0;
}

upstream socketio_server {
    server websocket:9000 fail_timeout=0;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;
    client_body_buffer_size 16k;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Static assets
    location /assets {
        alias /var/www/html/assets;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Public files (logos, avatars)
    location ~ ^/files/(.*)$ {
        alias /var/www/html/sites/$http_host/public/files/$1;
        try_files $uri =404;
    }

    # Private files (protected via Frappe auth check)
    location ~ ^/private/files/(.*)$ {
        internal;
        alias /var/www/html/sites/$http_host/private/files/$1;
    }

    # Realtime WebSockets (Socket.io)
    location /socket.io {
        proxy_pass http://socketio_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All API & Web views
    location / {
        proxy_pass http://frappe_backend;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}
